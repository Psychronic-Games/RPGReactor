<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Fill Tool">
  <defs>
    <linearGradient id="bucket-body" x1="15" y1="22" x2="43" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0876ed"/>
      <stop offset=".55" stop-color="#07399f"/>
      <stop offset="1" stop-color="#03142f"/>
    </linearGradient>
    <linearGradient id="bucket-paint" x1="29" y1="21" x2="53" y2="57" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff59c"/>
      <stop offset=".42" stop-color="#ffd529"/>
      <stop offset="1" stop-color="#f08a0c"/>
    </linearGradient>
  </defs>

  <!-- A broad puddle keeps the fill action readable at small toolbar sizes. -->
  <path d="M32 51c4-3 8-4 12-2l4 2c2 1 5 1 8 2 5 2 4 7-1 8H32c-5-1-5-7 0-10z" fill="#01030a" stroke="#01030a" stroke-width="3" stroke-linejoin="round"/>
  <path d="M33 53c5-3 8-3 12-1l4 2c2 1 5 1 7 2 2 1 1 3-2 3H33c-3-1-3-4 0-6z" fill="url(#bucket-paint)" stroke="#d7318f" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- The handle sits behind a traditional tapered paint bucket. -->
  <g transform="rotate(28 28 30)" stroke-linejoin="round">
    <path d="M16 25v-6C16 8 40 8 40 19v7" fill="none" stroke="#01030a" stroke-width="7" stroke-linecap="round"/>
    <path d="M16 25v-6C16 8 40 8 40 19v7" fill="none" stroke="#24bdf3" stroke-width="2.5" stroke-linecap="round"/>

    <path d="M10 22h36l-4 28H15z" fill="#01030a" stroke="#01030a" stroke-width="6"/>
    <path d="M13 24h30l-3.5 23H17z" fill="url(#bucket-body)" stroke="#075cdd" stroke-width="2"/>
    <path d="M18 27h5l-2.5 17h-4z" fill="#24bdf3" opacity=".65"/>
    <path d="M37 27h4l-2.5 17h-4z" fill="#d7318f" opacity=".8"/>

    <ellipse cx="28" cy="23.5" rx="17" ry="5.5" fill="#01030a" stroke="#01030a" stroke-width="3"/>
    <path d="M13 23.5c4-4 26-4 30 0-4 4-26 4-30 0z" fill="url(#bucket-paint)" stroke="#fff2a0" stroke-width="1.8"/>
  </g>

  <!-- Paint leaves the lowered rim and joins the puddle. -->
  <path d="M46 34c5 4 7 8 5 14" fill="none" stroke="#01030a" stroke-width="8" stroke-linecap="round"/>
  <path d="M46 34c5 4 7 8 5 14" fill="none" stroke="url(#bucket-paint)" stroke-width="4" stroke-linecap="round"/>
</svg>
