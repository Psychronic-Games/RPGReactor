name: GUI smokes

# The real editor driven through WebDriver on a runner with no GPU. Run by hand
# (Actions > GUI smokes > Run workflow), before a release. Taken off every push
# on 2026-11-21: on GitHub runners these hung at random (a different smoke each
# time, WebDriver execute/async never answering) and turned main red with no
# fault in the editor; the same smoke passes on a clean clone on the desktop.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gui-smokes:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NWJS_VERSION: 0.120.0
      NWJS_SHA256: 97baefb1795dc17a3b8e45ebc0361767ddd52aa339a015c627a4381d6945fe9f
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editor/package-lock.json
      - name: Install exact dependencies without lifecycle scripts
        working-directory: editor
        run: npm ci --ignore-scripts
      - name: Download and verify pinned NW.js SDK
        shell: bash
        run: |
          archive="$RUNNER_TEMP/nwjs-sdk.tar.gz"
          sdk_root="$RUNNER_TEMP/nwjs-sdk"
          curl --fail --location --retry 3 --output "$archive" \
            "https://dl.nwjs.io/v${NWJS_VERSION}/nwjs-sdk-v${NWJS_VERSION}-linux-x64.tar.gz"
          printf '%s  %s\n' "$NWJS_SHA256" "$archive" | sha256sum --check --strict
          mkdir "$sdk_root"
          tar --extract --gzip --file "$archive" --directory "$sdk_root" --strip-components=1
          printf 'NWJS_SDK_ROOT=%s\n' "$sdk_root" >> "$GITHUB_ENV"
      - name: Run real Web editor persistence smoke
        working-directory: editor
        run: xvfb-run --auto-servernum npm run smoke:web
      - name: Run real NW.js editor save smoke
        working-directory: editor
        run: xvfb-run --auto-servernum npm run smoke:nw -- --nw-root="$NWJS_SDK_ROOT"
      - name: Audit NW.js interaction order and delayed callbacks
        working-directory: editor
        run: xvfb-run --auto-servernum npm run smoke:nw-interactions -- --nw-root="$NWJS_SDK_ROOT"
      - name: Verify list and dropdown keyboard navigation
        working-directory: editor
        run: xvfb-run --auto-servernum npm run smoke:nw-keyboard -- --nw-root="$NWJS_SDK_ROOT" --size=1280x720
      - name: Verify menu, context-menu and dialog keyboard navigation
        working-directory: editor
        run: xvfb-run --auto-servernum npm run smoke:nw-menus -- --nw-root="$NWJS_SDK_ROOT" --size=1280x720
      - name: Verify event double-click opens the editor in 2D and 3D
        working-directory: editor
        run: xvfb-run --auto-servernum npm run smoke:nw-event-double-click -- --nw-root="$NWJS_SDK_ROOT"
      - name: Upload interaction audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interaction-audit
          if-no-files-found: ignore
          path: |
            /tmp/rr-interaction-result.json
            /tmp/rr-interaction-after.png
            /tmp/rr-issue54-result.json
            /tmp/rr-issue54-after.png
            /tmp/rr-keyboard-menus-result.json
            /tmp/rr-keyboard-menus-after.png
      - name: Clean up NW.js SDK
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/nwjs-sdk" "$RUNNER_TEMP/nwjs-sdk.tar.gz"
